name: Feature request
description: 提議對自建自介網站有明確價值的功能
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請先描述使用者困難，而不是只描述解法。
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: 使用者與情境
      description: 誰會使用？公開 Studio、本機作者、fork 維護者或部署者？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方式
  - type: checkboxes
    id: contract
    attributes:
      label: 可能影響
      options:
        - label: 需要新增或變更公開內容欄位
        - label: 需要變更 Studio UI 或預覽
        - label: 需要變更部署或安全邊界
        - label: 可能影響既有 fork 的相容性
