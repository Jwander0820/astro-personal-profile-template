name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The full regression suite gates deployment of the upstream template: a
  # failure stops here and the published site keeps serving the last good
  # build. The browser suite assumes the starter content, so personal forks are
  # gated by `npm run build` (Astro diagnostics and content validation) only,
  # unless they opt in with the repository variable DEPLOY_RUN_CHECKS=true.
  verify:
    if: ${{ github.repository == 'Jwander0820/astro-personal-profile-template' || vars.DEPLOY_RUN_CHECKS == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      ONLINE_STUDIO_MODE: ${{ vars.ONLINE_STUDIO_MODE || 'auto' }}
      ONLINE_STUDIO_ALLOWED_REPOSITORIES: ${{ vars.ONLINE_STUDIO_ALLOWED_REPOSITORIES || 'Jwander0820/astro-personal-profile-template' }}
      ONLINE_STUDIO_ALLOWED_SITES: ${{ vars.ONLINE_STUDIO_ALLOWED_SITES }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Explicit so a skipped verify job on forks does not skip deployment too.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
